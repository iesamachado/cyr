<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <!-- HDMI Plug -->
  <!-- Metal connector with angled bottom -->
  <polygon points="50,0 70,0 70,12 67,18 53,18 50,12" fill="#e0e0e0" stroke="#777" stroke-width="1" />
  <rect x="52" y="2" width="16" height="4" fill="#333" />
  <!-- Plastic grip -->
  <rect x="46" y="18" width="28" height="20" fill="#222" rx="2" />
  <rect x="52" y="22" width="16" height="12" fill="#444" />
  
  <!-- Cable -->
  <path d="M 60 38 Q 40 50 60 70" stroke="#111" stroke-width="4" fill="none" />
  
  <!-- Monitor Stand -->
  <rect x="50" y="130" width="20" height="20" fill="#333" />
  <rect x="35" y="150" width="50" height="5" fill="#444" rx="2"/>
  
  <!-- Monitor Screen -->
  <rect x="5" y="60" width="110" height="70" fill="#111" stroke="#333" stroke-width="4" rx="4"/>
  <rect x="10" y="65" width="100" height="60" fill="#0b1e16" />
  
  <!-- Screen content -->
  <text x="15" y="80" fill="#39ff14" font-family="monospace" font-size="6">cybersmith@os:~$</text>
  <rect x="62" y="74" width="4" height="8" fill="#39ff14" />
  
</svg>
