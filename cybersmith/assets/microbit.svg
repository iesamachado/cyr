<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Board -->
  <rect x="5" y="5" width="90" height="70" fill="#222" rx="5" />
  
  <!-- Edge connector (gold pins) -->
  <rect x="5" y="65" width="90" height="10" fill="#222" />
  <rect x="10" y="65" width="10" height="10" fill="#ffd700" />
  <rect x="25" y="65" width="5" height="10" fill="#ffd700" />
  <rect x="35" y="65" width="10" height="10" fill="#ffd700" />
  <rect x="50" y="65" width="5" height="10" fill="#ffd700" />
  <rect x="60" y="65" width="10" height="10" fill="#ffd700" />
  <rect x="75" y="65" width="5" height="10" fill="#ffd700" />
  <rect x="85" y="65" width="5" height="10" fill="#ffd700" />

  <!-- Button A -->
  <circle cx="15" cy="35" r="5" fill="#111" stroke="#555" stroke-width="2" />
  <text x="15" y="50" fill="#fff" font-family="sans-serif" font-size="8" text-anchor="middle">A</text>
  
  <!-- Button B -->
  <circle cx="85" cy="35" r="5" fill="#111" stroke="#555" stroke-width="2" />
  <text x="85" y="50" fill="#fff" font-family="sans-serif" font-size="8" text-anchor="middle">B</text>
  
  <!-- LED Matrix 5x5 -->
  <g fill="#ff0000">
    <!-- Row 1 -->
    <rect x="35" y="20" width="4" height="4" />
    <rect x="42" y="20" width="4" height="4" />
    <rect x="49" y="20" width="4" height="4" />
    <rect x="56" y="20" width="4" height="4" />
    <rect x="63" y="20" width="4" height="4" />
    <!-- Row 2 -->
    <rect x="35" y="27" width="4" height="4" />
    <rect x="42" y="27" width="4" height="4" />
    <rect x="49" y="27" width="4" height="4" />
    <rect x="56" y="27" width="4" height="4" />
    <rect x="63" y="27" width="4" height="4" />
    <!-- Row 3 -->
    <rect x="35" y="34" width="4" height="4" />
    <rect x="42" y="34" width="4" height="4" />
    <rect x="49" y="34" width="4" height="4" />
    <rect x="56" y="34" width="4" height="4" />
    <rect x="63" y="34" width="4" height="4" />
    <!-- Row 4 -->
    <rect x="35" y="41" width="4" height="4" />
    <rect x="42" y="41" width="4" height="4" />
    <rect x="49" y="41" width="4" height="4" />
    <rect x="56" y="41" width="4" height="4" />
    <rect x="63" y="41" width="4" height="4" />
    <!-- Row 5 -->
    <rect x="35" y="48" width="4" height="4" />
    <rect x="42" y="48" width="4" height="4" />
    <rect x="49" y="48" width="4" height="4" />
    <rect x="56" y="48" width="4" height="4" />
    <rect x="63" y="48" width="4" height="4" />
  </g>
</svg>
