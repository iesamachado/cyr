<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <!-- USB Type-A Plug -->
  <!-- Metal connector -->
  <rect x="42" y="0" width="16" height="15" fill="#e0e0e0" stroke="#777" stroke-width="1"/>
  <!-- Two square holes -->
  <rect x="45" y="4" width="3" height="3" fill="#333" />
  <rect x="52" y="4" width="3" height="3" fill="#333" />
  <!-- Plastic grip -->
  <rect x="40" y="15" width="20" height="15" fill="#222" rx="2" />
  <rect x="45" y="18" width="10" height="8" fill="#444" />
  <!-- Cable -->
  <path d="M 50 30 Q 60 45 50 60" stroke="#222" stroke-width="3" fill="none" />
  
  <!-- Keyboard Body -->
  <rect x="5" y="60" width="90" height="40" fill="#222" rx="4" stroke="#555" stroke-width="2"/>
  
  <!-- Keys row 1 -->
  <rect x="10" y="65" width="6" height="6" fill="#444" rx="1"/>
  <rect x="18" y="65" width="6" height="6" fill="#444" rx="1"/>
  <rect x="26" y="65" width="6" height="6" fill="#444" rx="1"/>
  <rect x="34" y="65" width="6" height="6" fill="#444" rx="1"/>
  <rect x="42" y="65" width="6" height="6" fill="#444" rx="1"/>
  <rect x="50" y="65" width="6" height="6" fill="#444" rx="1"/>
  <rect x="58" y="65" width="6" height="6" fill="#444" rx="1"/>
  <rect x="66" y="65" width="6" height="6" fill="#444" rx="1"/>
  <rect x="74" y="65" width="16" height="6" fill="#444" rx="1"/>
  
  <!-- Keys row 2 -->
  <rect x="10" y="73" width="9" height="6" fill="#444" rx="1"/>
  <rect x="21" y="73" width="6" height="6" fill="#444" rx="1"/>
  <rect x="29" y="73" width="6" height="6" fill="#444" rx="1"/>
  <rect x="37" y="73" width="6" height="6" fill="#444" rx="1"/>
  <rect x="45" y="73" width="6" height="6" fill="#444" rx="1"/>
  <rect x="53" y="73" width="6" height="6" fill="#444" rx="1"/>
  <rect x="61" y="73" width="6" height="6" fill="#444" rx="1"/>
  <rect x="69" y="73" width="6" height="6" fill="#444" rx="1"/>
  <rect x="77" y="73" width="13" height="14" fill="#444" rx="1"/> <!-- Enter key -->
  
  <!-- Keys row 3 -->
  <rect x="10" y="81" width="12" height="6" fill="#444" rx="1"/>
  <rect x="24" y="81" width="6" height="6" fill="#444" rx="1"/>
  <rect x="32" y="81" width="6" height="6" fill="#444" rx="1"/>
  <rect x="40" y="81" width="6" height="6" fill="#444" rx="1"/>
  <rect x="48" y="81" width="6" height="6" fill="#444" rx="1"/>
  <rect x="56" y="81" width="6" height="6" fill="#444" rx="1"/>
  <rect x="64" y="81" width="6" height="6" fill="#444" rx="1"/>
  <rect x="72" y="81" width="3" height="6" fill="#444" rx="1"/>
  
  <!-- Keys row 4 -->
  <rect x="10" y="89" width="8" height="6" fill="#444" rx="1"/>
  <rect x="20" y="89" width="8" height="6" fill="#444" rx="1"/>
  <rect x="30" y="89" width="36" height="6" fill="#444" rx="1"/> <!-- Spacebar -->
  <rect x="68" y="89" width="6" height="6" fill="#444" rx="1"/>
  <rect x="76" y="89" width="6" height="6" fill="#444" rx="1"/>
  <rect x="84" y="89" width="6" height="6" fill="#444" rx="1"/>
</svg>
