<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ClassHub — Plataforma unificada de juegos educativos con integración Google Classroom. MecanoClass, RompeCódigos, H3L4D0S y MOON en un solo lugar.">
  <title>ClassHub — Juegos Educativos</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">

  <link rel="stylesheet" href="css/common/design-system.css">
  <link rel="stylesheet" href="css/common/reset.css">
  <link rel="stylesheet" href="css/common/layout.css">
  <link rel="stylesheet" href="css/common/components.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <!-- Canvas partículas -->
  <canvas id="particles-canvas" class="hero-canvas" aria-hidden="true"></canvas>

  <!-- Hero principal -->
  <main class="hero" id="login-hero">

    <!-- Logo + título -->
    <div class="hero-content" id="login-panel">

      <div class="login-logo animate-fade-up">
        <span class="login-logo-icon">🎓</span>
        <h1 class="login-title">Class<span class="login-title-accent">Hub</span></h1>
        <p class="login-tagline">La plataforma de juegos educativos de tu centro</p>
      </div>

      <!-- Tarjetas de juegos (preview) -->
      <div class="login-games-preview animate-fade-up delay-1" aria-hidden="true">
        <div class="login-game-chip" style="--chip-color:#00d4ff">⌨️ MecanoClass</div>
        <div class="login-game-chip" style="--chip-color:#ff6b35">🔐 RompeCódigos</div>
        <div class="login-game-chip" style="--chip-color:#ff8fab">🍦 H3L4D0S</div>
        <div class="login-game-chip" style="--chip-color:#a8d8ea">🌙 MOON</div>
      </div>

      <!-- Panel de login -->
      <div class="login-card animate-fade-up delay-2" id="panel-role-select">
        <h2 class="login-card-title">¿Cómo entras hoy?</h2>
        <p class="login-card-sub">Selecciona tu rol para continuar</p>

        <div class="login-role-buttons">
          <!-- DOCENTE -->
          <button class="login-role-btn login-role-btn--teacher" id="btn-teacher-google">
            <span class="role-btn-icon">👨‍🏫</span>
            <div class="role-btn-text">
              <strong>Soy Docente</strong>
              <small>Accedo con Google + Classroom</small>
            </div>
            <span class="role-btn-arrow">→</span>
          </button>

          <!-- ALUMNO -->
          <button class="login-role-btn login-role-btn--student" id="btn-student-google">
            <span class="role-btn-icon">👨‍🎓</span>
            <div class="role-btn-text">
              <strong>Soy Alumno/a</strong>
              <small>Accedo con mi cuenta Google</small>
            </div>
            <span class="role-btn-arrow">→</span>
          </button>
        </div>

        <div class="form-divider">o</div>

        <!-- LOGIN EMAIL -->
        <form id="form-email-login" class="form-email" novalidate>
          <div class="form-group">
            <label class="form-label" for="email-input">Correo electrónico</label>
            <input type="email" id="email-input" name="email"
                   placeholder="alumno@centro.edu" autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="pass-input">Contraseña</label>
            <div class="input-password-wrap">
              <input type="password" id="pass-input" name="password"
                     placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="input-pass-toggle" id="btn-toggle-pass"
                      aria-label="Mostrar contraseña">👁</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="role-select">Entro como</label>
            <select id="role-select" name="role">
              <option value="student">Alumno/a</option>
              <option value="teacher">Docente</option>
            </select>
          </div>

          <p id="login-error" class="form-error" aria-live="polite"></p>

          <button type="submit" class="btn btn-outline btn--full" id="btn-email-login">
            Iniciar sesión
          </button>
        </form>

        <div class="login-footer">
          <button class="link-btn" id="btn-show-register">¿Sin cuenta? Regístrate</button>
          <span class="sep">·</span>
          <button class="link-btn" id="btn-forgot">¿Olvidaste tu contraseña?</button>
        </div>
      </div>

      <!-- Panel de registro (oculto por defecto) -->
      <div class="login-card login-card--hidden animate-fade-up delay-2" id="panel-register">
        <button class="btn-back" id="btn-back-login">← Volver</button>
        <h2 class="login-card-title">Crear cuenta</h2>

        <form id="form-register" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Nombre completo</label>
            <input type="text" id="reg-name" placeholder="Tu nombre" autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Correo electrónico</label>
            <input type="email" id="reg-email" placeholder="correo@centro.edu" autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-pass">Contraseña</label>
            <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-role">Me registro como</label>
            <select id="reg-role">
              <option value="student">Alumno/a</option>
              <option value="teacher">Docente</option>
            </select>
          </div>
          <p id="register-error" class="form-error" aria-live="polite"></p>
          <button type="submit" class="btn btn-primary btn--full">Crear cuenta</button>
        </form>
      </div>

    </div>
  </main>

  <script type="module" src="js/index.js"></script>
</body>
</html>
