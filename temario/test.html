<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyR ClassHub — Test de Evaluación</title>
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">

  <link rel="stylesheet" href="../css/common/design-system.css">
  <link rel="stylesheet" href="../css/common/reset.css">
  <link rel="stylesheet" href="../css/common/layout.css">
  <link rel="stylesheet" href="../css/common/components.css">
  
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .test-wrapper {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .test-header {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-bar-bg {
      background: #e9ecef;
      height: 10px;
      border-radius: 5px;
      flex: 1;
      margin: 0 20px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .question-card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .option-label {
      display: block;
      padding: 15px 20px;
      margin-bottom: 15px;
      background: #f8f9fa;
      border: 2px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.1rem;
    }
    .option-label:hover {
      background: #eef2f5;
      border-color: #bdc3c7;
    }
    .option-label.selected {
      background: var(--accent-light, #FFB2EF);
      border-color: var(--text-primary);
      box-shadow: 4px 4px 0px var(--text-primary);
      transform: translate(-2px, -2px);
      color: var(--text-primary);
      font-weight: 500;
    }

    .test-layout {
      display: flex;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      gap: 30px;
      width: 100%;
      flex: 1;
    }
    .test-sidebar {
      width: 250px;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      .test-layout {
        flex-direction: column-reverse;
      }
      .test-sidebar {
        width: 100%;
      }
    }
    .nav-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: white;
      color: #888;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.1rem;
    }
    .nav-btn:hover {
      background: #f8f9fa;
      border-color: #999;
    }
    .nav-btn.answered {
      background: var(--accent);
      color: var(--text-primary);
      border-color: var(--text-primary);
      box-shadow: 2px 2px 0px var(--text-primary);
    }
    .nav-btn.blank {
      background: #f1c40f; /* Amarillo fuerte */
      color: var(--text-primary);
      border-color: var(--text-primary);
      box-shadow: 2px 2px 0px var(--text-primary);
    }
    .nav-btn.current {
      border: 3px solid var(--text-primary);
      transform: scale(1.1) translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--text-primary);
      color: var(--text-primary);
    }
    .controls {

      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="app-header"></div>

  <div class="test-wrapper" id="loading-view">
    <div style="text-align: center; margin-top: 100px;">
      <h2 style="color: var(--text-muted);">Cargando test...</h2>
      <p>Buscando las mejores preguntas en la base de datos.</p>
    </div>
  </div>

  <div class="test-layout" id="test-view" style="display: none;">
    <aside class="test-sidebar">
      <div class="question-card" style="padding: 20px; position: sticky; top: 100px;">
        <h3 style="margin-bottom: 15px; font-size: 1.2rem; text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 10px;">Mapa del Test</h3>
        <div id="q-navigator" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 5px;">
           <!-- JS will inject buttons here -->
        </div>
      </div>
    </aside>

    <div class="test-wrapper" style="margin: 0; padding: 0;">
      <div class="test-header">
        <div style="font-weight: bold; color: var(--text-muted);" id="q-counter">Pregunta 1 de 10</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <button class="btn btn-ghost btn--sm" id="btn-exit">✕ Salir</button>
      </div>

      <div class="question-card" id="q-card">
        <!-- Question injected here -->
      </div>

      <div class="controls">
        <button class="btn btn-outline" id="btn-prev" style="visibility: hidden; font-weight:bold;">⬅ Anterior</button>
        <button class="btn btn-primary" id="btn-next" style="font-weight:bold;">Siguiente ➡</button>
      </div>
    </div>
  </div>

  <div class="test-wrapper" id="results-view" style="display: none;">
    <div class="question-card" style="text-align: center; padding: 60px 20px;" id="results-content">
      <!-- Results injected here -->
    </div>
  </div>
  
  <div id="toast-container" aria-live="polite"></div>

  <script type="module" src="../js/test_teoria.js"></script>
</body>
</html>
